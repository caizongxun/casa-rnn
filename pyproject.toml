[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casa-rnn"
version = "0.3.0"
description = "BTC Actor v3: multi-scale patch transformer + full RL pipeline"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "hmmlearn>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
