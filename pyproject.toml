[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casa-rnn"
version = "0.2.0"
description = "BTC Actor: Patch-Transformer + REINFORCE RL trader"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
