[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "casa-rnn"
version = "0.1.0"
description = "Causal Adaptive State Autoregressive RNN for financial market sequence modeling"
authors = [{name = "zong", email = "placeholder@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["rnn", "finance", "deep-learning", "pytorch", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/caizongxun/casa-rnn"
Repository = "https://github.com/caizongxun/casa-rnn"

[tool.setuptools.packages.find]
where = ["src"]
